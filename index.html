<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎤 演唱會即時翻譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 560px; margin: 0 auto; }

    h1 {
      font-size: 1.3rem; text-align: center;
      margin-bottom: 20px; letter-spacing: 0.05em; color: #eee;
    }

    /* Setup card */
    .card {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.75rem; color: #888; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 12px;
    }
    label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
    input[type=password], select {
      width: 100%; padding: 11px 12px;
      border-radius: 10px; border: 1px solid #333;
      background: #2c2c2e; color: #fff;
      font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    input[type=password]:focus, select:focus { border-color: #555; }
    input[type=password]:last-child, select:last-child { margin-bottom: 0; }

    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }

    /* Buttons */
    .btn {
      width: 100%; padding: 17px; border-radius: 14px; border: none;
      font-size: 1.15rem; font-weight: 700; cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-start { background: #30d158; color: #000; }
    .btn-stop  { background: #ff453a; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status */
    .status {
      text-align: center; padding: 8px 0 2px;
      font-size: 0.85rem; color: #666;
    }
    .status.active { color: #30d158; }
    .status.error  { color: #ff453a; }

    /* Caption display */
    .captions {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 20px 18px;
      margin-top: 14px;
    }
    .cap-label {
      font-size: 0.7rem; color: #555;
      text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 6px;
    }
    .original-text {
      font-size: 1rem; color: #888; min-height: 28px;
      line-height: 1.55; margin-bottom: 20px;
      word-break: break-all;
    }
    .translated-text {
      font-size: 1.8rem; color: #fff;
      line-height: 1.45; min-height: 54px;
      font-weight: 500; word-break: break-all;
    }

    /* API key helper */
    .helper {
      font-size: 0.78rem; color: #555; text-align: center;
      margin-top: 12px; line-height: 1.6;
    }
    .helper a { color: #0a84ff; text-decoration: none; }

    .tip {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #666;
      line-height: 1.6;
    }
    .tip strong { color: #888; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎤 演唱會即時翻譯</h1>

  <div class="card">
    <div class="card-title">設定</div>

    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />

    <div class="row">
      <div>
        <label>來源語言（藝人說的）</label>
        <select id="sourceLang">
          <option value="ja">🇯🇵 日文</option>
          <option value="ko">🇰🇷 韓文</option>
          <option value="en">🇺🇸 英文</option>
          <option value="zh-Hans">🇨🇳 中文（簡體）</option>
        </select>
      </div>
      <div>
        <label>翻譯成</label>
        <select id="targetLang">
          <option value="zh-Hant">繁體中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn btn-start" id="startBtn" onclick="startTranslation()">▶ 開始翻譯</button>
  <button class="btn btn-stop"  id="stopBtn"  onclick="stopTranslation()" style="display:none">■ 停止</button>

  <div class="status" id="status">準備就緒</div>

  <div class="captions" id="captions" style="display:none">
    <div class="cap-label">原文</div>
    <div class="original-text" id="originalText">—</div>
    <div class="cap-label">翻譯</div>
    <div class="translated-text" id="translatedText">—</div>
  </div>

  <div class="tip">
    <strong>效果最佳情況：</strong> 藝人暫停音樂說話（MC）時效果最好。<br>
    背景有大聲音樂時準確度可能下降。
  </div>

  <p class="helper">
    還沒有 API Key？免費申請：<br>
    <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
  </p>
</div>

<script>
let ws = null;
let audioContext = null;
let processor = null;
let micStream = null;
let running = false;

// 載入儲存的 API Key
window.onload = () => {
  const saved = localStorage.getItem('gemini_key');
  if (saved) document.getElementById('apiKey').value = saved;
};
document.getElementById('apiKey').addEventListener('input', e => {
  localStorage.setItem('gemini_key', e.target.value.trim());
});

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function startTranslation() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { setStatus('請先填入 Gemini API Key', 'error'); return; }

  const targetLang = document.getElementById('targetLang').value;

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('captions').style.display = 'block';
  document.getElementById('originalText').textContent = '—';
  document.getElementById('translatedText').textContent = '—';
  setStatus('連線中...');
  running = true;

  const WS_URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
  ws = new WebSocket(WS_URL);

  ws.onopen = async () => {
    const setup = {
      setup: {
        model: 'models/gemini-3.5-live-translate-preview',
        generationConfig: {
          responseModalities: ['AUDIO'],
          inputAudioTranscription: {},
          outputAudioTranscription: {},
          translationConfig: {
            targetLanguageCode: targetLang,
            echoTargetLanguage: false
          }
        }
      }
    };
    ws.send(JSON.stringify(setup));
    setStatus('● 翻譯中', 'active');

    try {
      await startMic();
    } catch (err) {
      setStatus('麥克風存取失敗：' + err.message, 'error');
      stopTranslation();
    }
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      const content = data.serverContent;
      if (!content) return;
      if (content.inputTranscription?.text) {
        document.getElementById('originalText').textContent = content.inputTranscription.text;
      }
      if (content.outputTranscription?.text) {
        document.getElementById('translatedText').textContent = content.outputTranscription.text;
      }
    } catch (_) {}
  };

  ws.onerror = () => {
    setStatus('連線錯誤，請確認 API Key 是否正確', 'error');
    stopTranslation();
  };

  ws.onclose = () => {
    if (running) {
      setStatus('連線已中斷', 'error');
      stopTranslation();
    }
  };
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: false }
  });

  audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(micStream);

  // ScriptProcessor: 1600 samples = 100ms at 16kHz
  processor = audioContext.createScriptProcessor(1600, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const bytes = new Uint8Array(i16.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({
      realtimeInput: { audio: { data: btoa(bin), mimeType: 'audio/pcm;rate=16000' } }
    }));
  };

  source.connect(processor);
  processor.connect(audioContext.destination);
}

function stopTranslation() {
  running = false;
  if (processor) { try { processor.disconnect(); } catch (_) {} processor = null; }
  if (audioContext) { try { audioContext.close(); } catch (_) {} audioContext = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }

  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
  setStatus('已停止');
}
</script>
</body>
</html>
