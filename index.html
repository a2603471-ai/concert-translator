<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎤 演唱會即時翻譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d; color: #fff;
      min-height: 100vh; padding: 16px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; color: #eee; }

    .card { background: #1c1c1e; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card-title { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
    input[type=password], select {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid #333; background: #2c2c2e; color: #fff;
      font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }

    .card-divider { border: none; border-top: 1px solid #2a2a2a; margin: 4px 0; }

    /* Toggle row */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
    }
    .toggle-left { flex: 1; padding-right: 12px; }
    .toggle-title { font-size: 0.85rem; color: #ccc; }
    .toggle-desc { font-size: 0.72rem; color: #555; margin-top: 3px; line-height: 1.4; }
    .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3a3a3c; border-radius: 26px; transition: .2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background-color: #30d158; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* 進階設定 */
    .advanced-section { margin-bottom: 14px; }
    .advanced-trigger {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; cursor: pointer; user-select: none;
      background: #1c1c1e; border-radius: 16px;
    }
    .advanced-trigger.open { border-radius: 16px 16px 0 0; }
    .advanced-trigger-title { font-size: 0.85rem; color: #888; }
    .advanced-arrow { color: #555; font-size: 0.72rem; transition: transform 0.2s; }
    .advanced-arrow.open { transform: rotate(180deg); }
    .advanced-body { display: none; }
    .advanced-body.open { display: block; }
    .advanced-body .card { border-radius: 0 0 16px 16px; margin-bottom: 0; }

    /* Collapsible prompt */
    .collapsible-trigger {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; cursor: pointer; user-select: none;
    }
    .collapsible-left .trigger-title { font-size: 0.85rem; color: #ccc; }
    .collapsible-left .trigger-desc { font-size: 0.72rem; color: #555; margin-top: 3px; }
    .collapsible-arrow { color: #555; font-size: 0.72rem; transition: transform 0.2s; padding-left: 8px; }
    .collapsible-arrow.open { transform: rotate(180deg); }
    .collapsible-body { display: none; padding-bottom: 4px; }
    .collapsible-body.open { display: block; }
    textarea.sys-prompt {
      width: 100%; height: 150px; padding: 10px 12px;
      border-radius: 10px; border: 1px solid #333; background: #2c2c2e;
      color: #888; font-size: 0.75rem; font-family: inherit;
      resize: vertical; outline: none; line-height: 1.55;
    }

    .btn { width: 100%; padding: 17px; border-radius: 14px; border: none; font-size: 1.15rem; font-weight: 700; cursor: pointer; }
    .btn-start { background: #30d158; color: #000; }
    .btn-stop  { background: #ff453a; color: #fff; }

    .status { text-align: center; padding: 8px 0 2px; font-size: 0.85rem; color: #666; }
    .status.active { color: #30d158; }
    .status.error  { color: #ff453a; }

    .cost-line {
      text-align: center; font-size: 0.75rem; color: #444;
      padding-bottom: 4px; display: none;
    }
    .cost-line .cost-val { color: #666; }

    /* 狀態燈號列 */
    .status-lights {
      display: none;
      text-align: center; font-size: 0.85rem; color: #666;
      padding: 4px 0 6px; line-height: 1.6;
    }
    .status-lights .warn { color: #ff9f0a; }

    .error-box {
      background: #2a0f0f; border: 1px solid #7f1d1d; border-radius: 10px;
      padding: 12px 14px; margin-top: 10px; font-size: 0.82rem; color: #fca5a5;
      line-height: 1.6; display: none; word-break: break-all;
    }

    .captions { background: #1c1c1e; border-radius: 16px; padding: 20px 18px; margin-top: 14px; }
    .cap-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }

    /* 字幕歷史（3 段，舊→新由上到下） */
    .hist-orig    { font-size: 0.72rem; color: #2e2e30; line-height: 1.5; word-break: break-all; }
    .hist-orig.h2 { font-size: 0.77rem; color: #3a3a3c; }
    .hist-orig.h1 { font-size: 0.82rem; color: #444;    margin-bottom: 4px; }
    .hist-trans    { font-size: 0.95rem; color: #2e2e30; line-height: 1.45; word-break: break-all; }
    .hist-trans.h2 { font-size: 1.05rem; color: #3a3a3c; }
    .hist-trans.h1 { font-size: 1.25rem; color: #666;    margin-bottom: 14px; }

    /* 目前句 */
    .original-text {
      font-size: 1rem; color: #888; min-height: 28px;
      line-height: 1.55; margin-bottom: 20px; word-break: break-all; transition: opacity 0.2s;
    }
    .translated-text {
      font-size: 1.8rem; color: #fff; line-height: 1.45;
      min-height: 54px; font-weight: 500; word-break: break-all; transition: opacity 0.2s;
    }
    .translated-text.partial { opacity: 0.45; }
    .original-text.partial   { opacity: 0.55; }

    .tip { background: #1c1c1e; border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 0.82rem; color: #666; line-height: 1.6; }
    .tip strong { color: #888; }
    .helper { font-size: 0.78rem; color: #555; text-align: center; margin-top: 12px; line-height: 1.6; }
    .helper a { color: #0a84ff; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎤 演唱會即時翻譯</h1>

  <!-- 基本設定 -->
  <div class="card">
    <div class="card-title">設定</div>
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy…" />
    <div class="row">
      <div>
        <label>來源語言（藝人說的）</label>
        <select id="sourceLang">
          <option value="ja">🇯🇵 日文</option>
          <option value="ko" selected>🇰🇷 韓文</option>
          <option value="en">🇺🇸 英文</option>
          <option value="zh-Hans">🇨🇳 中文（簡體）</option>
        </select>
      </div>
      <div>
        <label>翻譯成</label>
        <select id="targetLang">
          <option value="zh-Hant">繁體中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 進階設定（折疊） -->
  <div class="advanced-section">
    <div class="advanced-trigger" id="advancedTrigger" onclick="toggleAdvanced()">
      <span class="advanced-trigger-title">⚙️ 進階設定</span>
      <span class="advanced-arrow" id="advancedArrow">▼</span>
    </div>
    <div class="advanced-body" id="advancedBody">
      <div class="card">
        <!-- 精準分句 toggle -->
        <div class="toggle-row">
          <div class="toggle-left">
            <div class="toggle-title">精準分句（稍有延遲）</div>
            <div class="toggle-desc" id="aiSegmentDesc">關閉：即時顯示，上一段字幕會保留</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="aiSegment">
            <span class="slider"></span>
          </label>
        </div>

        <hr class="card-divider">

        <div class="row">
          <div>
            <label>費用上限保護</label>
            <select id="costLimit">
              <option value="0">不自動停止</option>
              <option value="5">NT$5</option>
              <option value="10" selected>NT$10</option>
              <option value="30">NT$30</option>
            </select>
          </div>
          <div>
            <label>麥克風降噪</label>
            <select id="noiseSuppression">
              <option value="false" selected>關閉（保留現場聲）</option>
              <option value="true">開啟（降低背景噪音）</option>
            </select>
          </div>
        </div>

        <div>
          <label>字幕保留時間</label>
          <select id="captionHold">
            <option value="8">8 秒</option>
            <option value="12" selected>12 秒（建議）</option>
            <option value="20">20 秒</option>
            <option value="30">30 秒</option>
          </select>
        </div>

        <hr class="card-divider">

        <!-- 翻譯提示詞 collapsible -->
        <div class="collapsible-trigger" onclick="toggleSysPrompt()">
          <div class="collapsible-left">
            <div class="trigger-title">翻譯提示詞</div>
            <div class="trigger-desc">字幕翻譯風格與規則</div>
          </div>
          <span class="collapsible-arrow" id="sysArrow">▼</span>
        </div>
        <div class="collapsible-body" id="sysBody">
          <textarea class="sys-prompt" id="sysPrompt"></textarea>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-start" id="startBtn" onclick="startTranslation()">▶ 開始翻譯</button>
  <button class="btn btn-stop"  id="stopBtn"  onclick="stopTranslation()" style="display:none">■ 停止</button>

  <div class="status" id="status">準備就緒</div>
  <div class="cost-line" id="costLine">本次消耗：<span class="cost-val" id="costDisplay">計算中…</span></div>
  <div class="status-lights" id="statusLights"></div>
  <div class="error-box" id="errorBox"></div>

  <div class="captions" id="captions" style="display:none">
    <div class="cap-label">原文</div>
    <div class="hist-orig"    id="histOrig3"></div>
    <div class="hist-orig h2" id="histOrig2"></div>
    <div class="hist-orig h1" id="histOrig1"></div>
    <div class="original-text" id="originalText">—</div>
    <div class="cap-label">翻譯</div>
    <div class="hist-trans"    id="histTrans3"></div>
    <div class="hist-trans h2" id="histTrans2"></div>
    <div class="hist-trans h1" id="histTrans1"></div>
    <div class="translated-text" id="translatedText">—</div>
  </div>

  <div class="tip">
    <strong>效果最佳情況：</strong> 藝人暫停音樂說話（MC）時效果最好。<br>
    背景有大聲音樂時準確度可能下降。
  </div>
  <p class="helper">
    還沒有 API Key？免費申請：<br>
    <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
  </p>
</div>

<script type="module">
import { GoogleGenAI } from 'https://esm.sh/@google/genai';

const DEFAULT_SYS_PROMPT =
`你是演唱會現場即時口譯員，負責將韓文與英文翻譯成台灣繁體中文。

<rules>
1. 只輸出翻譯結果，不加任何說明或開場白。
2. 口語化：使用台灣自然口語，簡短直白，避免書面語腔調。
3. 禁用中國用語（網絡→網路、視頻→影片、軟件→軟體、數據→資料）。
4. 專有名詞保留：藝人名、歌名、品牌保留原文或常見中文譯名。
5. 不加全角句號「。」，保持字幕輕盈感；感嘆號「！」、問號「？」正常使用。
6. 演唱會用語自然轉換：안코르→安可、화이팅→加油、오빠/언니視情況保留或翻譯。
7. 忠實保留情緒：感嘆、呼喊、粗口直翻，不美化不刪減。
8. 語句不完整時照樣翻，不補全、不猜測說話者意圖。
9. 多人同時說話時，翻譯能辨識出的內容，其餘略過；不需標示說話者身份。
</rules>`;

const RATE_INPUT_PER_M       = 3.50;
const RATE_OUTPUT_PER_M      = 21.00;
const RATE_AUDIO_PER_MIN_USD = 0.0368;
const USD_TWD                = 32;
const STABLE_FLUSH_MS        = 1600;
const PUNCT_FLUSH_MS         = 700;
const CAPTION_HISTORY_VERSION = '3';
const HIST_SIZE = 3;

let liveSession   = null;
let audioContext  = null;
let processor     = null;
let micStream     = null;
let running       = false;
let timerInterval = null;
let wakeLock      = null;


let sessionStart      = 0;
let totalInputTok     = 0;
let totalOutputTok    = 0;
let origBuffer        = '';
let transBuffer       = '';
let segFlushTimer     = null;
let currentCostTwd    = 0;
let costLimitTwd      = 0;
let autoStoppedByCost = false;
let audioChunkCount   = 0;
let silentChunkCount  = 0;
let lastAudioLevel    = 0;
let lastInputAt       = 0;
let lastOutputAt      = 0;
let captionHoldMs     = 12000;
let lastImmediateOriginal   = '';
let lastImmediateTranslated = '';

// History queues: index 0 = newest, index HIST_SIZE-1 = oldest
let origHistQueue  = [];
let transHistQueue = [];

// ── Init ──────────────────────────────────────────────────────────────────
window.onload = () => {
  const savedKey    = localStorage.getItem('gemini_key');
  const savedPrompt = localStorage.getItem('sys_prompt');
  if (localStorage.getItem('caption_history_version') !== CAPTION_HISTORY_VERSION) {
    localStorage.setItem('ai_segment', 'false');
    localStorage.setItem('caption_history_version', CAPTION_HISTORY_VERSION);
  }
  const savedSeg   = localStorage.getItem('ai_segment') === 'true';
  const savedNoise = localStorage.getItem('noise_suppression');
  const savedLimit = localStorage.getItem('cost_limit_twd');
  const savedHold  = localStorage.getItem('caption_hold_sec');

  if (savedKey) document.getElementById('apiKey').value = savedKey;
  document.getElementById('sysPrompt').value = savedPrompt ?? DEFAULT_SYS_PROMPT;
  document.getElementById('aiSegment').checked = savedSeg;
  if (savedNoise != null) document.getElementById('noiseSuppression').value = savedNoise;
  if (savedLimit != null) document.getElementById('costLimit').value = savedLimit;
  if (savedHold  != null) document.getElementById('captionHold').value = savedHold;
  refreshSegDesc();
};

document.getElementById('apiKey').addEventListener('input', e =>
  localStorage.setItem('gemini_key', e.target.value.trim()));
document.getElementById('sysPrompt').addEventListener('input', e =>
  localStorage.setItem('sys_prompt', e.target.value));
document.getElementById('aiSegment').addEventListener('change', () => {
  localStorage.setItem('ai_segment', document.getElementById('aiSegment').checked);
  refreshSegDesc();
  if (running) {
    clearTimeout(segFlushTimer); segFlushTimer = null;
    origBuffer = ''; transBuffer = '';
    document.getElementById('originalText').classList.remove('partial');
    document.getElementById('translatedText').classList.remove('partial');
  }
});
document.getElementById('noiseSuppression').addEventListener('change', e =>
  localStorage.setItem('noise_suppression', e.target.value));
document.getElementById('costLimit').addEventListener('change', e =>
  localStorage.setItem('cost_limit_twd', e.target.value));
document.getElementById('captionHold').addEventListener('change', e =>
  localStorage.setItem('caption_hold_sec', e.target.value));

// 回到前景時重新申請 Wake Lock
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible' && !wakeLock) {
    await requestWakeLock();
  }
});

// ── UI helpers ────────────────────────────────────────────────────────────
function refreshSegDesc() {
  const on = document.getElementById('aiSegment').checked;
  document.getElementById('aiSegmentDesc').textContent = on
    ? '開啟：內容穩定後自動收句，完整句移到上方保留'
    : '關閉：即時顯示，上一段字幕會保留';
}

window.toggleAdvanced = function() {
  const body    = document.getElementById('advancedBody');
  const arrow   = document.getElementById('advancedArrow');
  const trigger = document.getElementById('advancedTrigger');
  const open    = !body.classList.contains('open');
  body.classList.toggle('open', open);
  arrow.classList.toggle('open', open);
  trigger.classList.toggle('open', open);
};

window.toggleSysPrompt = function() {
  const body  = document.getElementById('sysBody');
  const arrow = document.getElementById('sysArrow');
  const open  = !body.classList.contains('open');
  body.classList.toggle('open', open);
  arrow.classList.toggle('open', open);
};

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className   = 'status ' + type;
}
function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent   = msg;
  b.style.display = 'block';
}
function hideError() { document.getElementById('errorBox').style.display = 'none'; }

// ── 狀態燈號 ──────────────────────────────────────────────────────────────
function updateStatusLights() {
  if (!running) return;
  const micOk  = lastAudioLevel > 0.003;
  const micTxt = micOk ? '🎤 有聲音' : '🔇 麥克風太安靜';

  let transTxt, isWarn = false;
  if (!lastOutputAt) {
    transTxt = '📡 等待翻譯…';
  } else {
    const secs = Math.round((Date.now() - lastOutputAt) / 1000);
    if (secs > 10) { transTxt = `⚠️ 超過 ${secs} 秒沒有翻譯`; isWarn = true; }
    else           { transTxt = `📨 翻譯 ${secs} 秒前`; }
  }

  const el = document.getElementById('statusLights');
  el.innerHTML = `${micTxt}&nbsp;&nbsp;｜&nbsp;&nbsp;<span${isWarn ? ' class="warn"' : ''}>${transTxt}</span>`;
}

// ── Segment flush ─────────────────────────────────────────────────────────
function isPunctEnd(text) {
  return /[！？!?～~…]+\s*$/.test(text || '');
}

function scheduleSegmentFlush(done) {
  clearTimeout(segFlushTimer);
  segFlushTimer = setTimeout(flushSegment, done ? PUNCT_FLUSH_MS : STABLE_FLUSH_MS);
}

function flushSegment() {
  segFlushTimer = null;
  if (!origBuffer && !transBuffer) return;
  if (origBuffer)  setPreviousCaption('original',   origBuffer);
  if (transBuffer) setPreviousCaption('translated', transBuffer);
  origBuffer  = '';
  transBuffer = '';
  const origEl  = document.getElementById('originalText');
  const transEl = document.getElementById('translatedText');
  origEl.textContent  = '';
  transEl.textContent = '';
  origEl.classList.remove('partial');
  transEl.classList.remove('partial');
}

function normalizeCaption(text) {
  return (text || '').replace(/\s+/g, '').trim();
}

function shouldPromotePrevious(prev, next) {
  const oldText = normalizeCaption(prev);
  const newText = normalizeCaption(next);
  if (oldText.length < 2 || !newText || oldText === newText) return false;
  if (newText.includes(oldText) || oldText.includes(newText)) return false;
  let commonPrefix = 0;
  const max = Math.min(oldText.length, newText.length);
  while (commonPrefix < max && oldText[commonPrefix] === newText[commonPrefix]) commonPrefix++;
  return commonPrefix / Math.max(oldText.length, newText.length) < 0.45;
}

// ── History queue ─────────────────────────────────────────────────────────
function renderHistQueue(type) {
  const isOrig = type === 'original';
  const q      = isOrig ? origHistQueue : transHistQueue;
  const prefix = isOrig ? 'histOrig' : 'histTrans';
  // slot 1 = newest (h1), slot 3 = oldest; q[0]=newest, q[2]=oldest
  for (let i = 1; i <= HIST_SIZE; i++) {
    document.getElementById(prefix + i).textContent = (q[i - 1]?.text) ?? '';
  }
}

function setPreviousCaption(type, text) {
  const isOrig = type === 'original';
  const q      = isOrig ? origHistQueue : transHistQueue;

  while (q.length >= HIST_SIZE) clearTimeout(q.pop().timer);

  const entry = { text, timer: null };
  entry.timer = setTimeout(() => {
    const idx = q.indexOf(entry);
    if (idx !== -1) { q.splice(idx, 1); renderHistQueue(type); }
  }, captionHoldMs);

  q.unshift(entry);
  renderHistQueue(type);
}

function clearAllHistory() {
  origHistQueue.forEach(e  => clearTimeout(e.timer));
  transHistQueue.forEach(e => clearTimeout(e.timer));
  origHistQueue  = [];
  transHistQueue = [];
  renderHistQueue('original');
  renderHistQueue('translated');
}

function updateImmediateCaption(type, nextText) {
  const isOrig    = type === 'original';
  const currentEl = document.getElementById(isOrig ? 'originalText' : 'translatedText');
  const prevText  = isOrig ? lastImmediateOriginal : lastImmediateTranslated;

  if (shouldPromotePrevious(prevText, nextText)) setPreviousCaption(type, prevText);
  currentEl.textContent = nextText;
  currentEl.classList.remove('partial');
  if (isOrig) { lastImmediateOriginal   = nextText; }
  else        { lastImmediateTranslated = nextText; }
}

// ── Cost display ──────────────────────────────────────────────────────────
function startTimer() { timerInterval = setInterval(refreshCost, 1000); }
function stopTimer()  { clearInterval(timerInterval); timerInterval = null; }

function refreshCost() {
  const secs = Math.floor((Date.now() - sessionStart) / 1000);
  const mm   = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss   = String(secs % 60).padStart(2, '0');

  let costStr;
  if (totalInputTok + totalOutputTok > 0) {
    const usd = (totalInputTok / 1e6) * RATE_INPUT_PER_M + (totalOutputTok / 1e6) * RATE_OUTPUT_PER_M;
    currentCostTwd = usd * USD_TWD;
    costStr = `${mm}:${ss} ｜ ${(totalInputTok + totalOutputTok).toLocaleString()} tokens ≈ NT$${currentCostTwd.toFixed(4)}`;
  } else {
    currentCostTwd = secs / 60 * RATE_AUDIO_PER_MIN_USD * USD_TWD;
    costStr = `${mm}:${ss} ｜ 付費估算 ≈ NT$${currentCostTwd.toFixed(4)}`;
  }
  document.getElementById('costDisplay').textContent = costStr;
  updateStatusLights();
  enforceCostLimit();
}

function enforceCostLimit() {
  if (!running || autoStoppedByCost || costLimitTwd <= 0) return;
  if (currentCostTwd < costLimitTwd) return;
  autoStoppedByCost = true;
  showError(`已達費用上限 NT$${costLimitTwd}，已自動停止。實際費用仍以 Google AI Studio 帳單為準。`);
  setStatus('費用上限停止', 'error');
  window.stopTranslation();
}

// ── Wake Lock ─────────────────────────────────────────────────────────────
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch (_) {}
}
async function releaseWakeLock() {
  if (!wakeLock) return;
  try { await wakeLock.release(); } catch (_) {}
  wakeLock = null;
}


// ── Main ──────────────────────────────────────────────────────────────────
window.startTranslation = async function() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { setStatus('請先填入 Gemini API Key', 'error'); return; }

  const targetLang  = document.getElementById('targetLang').value;
  const aiSegment   = document.getElementById('aiSegment').checked;
  const sysPromptTx = document.getElementById('sysPrompt').value.trim();
  costLimitTwd  = Number(document.getElementById('costLimit').value || 0);
  captionHoldMs = Number(document.getElementById('captionHold').value || 12) * 1000;

  document.getElementById('startBtn').style.display      = 'none';
  document.getElementById('stopBtn').style.display       = 'block';
  document.getElementById('captions').style.display      = 'block';
  document.getElementById('costLine').style.display      = 'block';
  document.getElementById('statusLights').style.display  = 'block';
  document.getElementById('originalText').textContent    = '—';
  document.getElementById('translatedText').textContent  = '—';
  document.getElementById('translatedText').classList.remove('partial');
  document.getElementById('originalText').classList.remove('partial');
  clearAllHistory();
  hideError();
  setStatus('連線中…');

  running           = true;
  origBuffer        = '';
  transBuffer       = '';
  clearTimeout(segFlushTimer); segFlushTimer = null;
  lastImmediateOriginal   = '';
  lastImmediateTranslated = '';
  totalInputTok     = 0;
  totalOutputTok    = 0;
  currentCostTwd    = 0;
  autoStoppedByCost = false;
  audioChunkCount   = 0;
  silentChunkCount  = 0;
  lastAudioLevel    = 0;
  lastInputAt       = 0;
  lastOutputAt      = 0;
  sessionStart      = Date.now();
  startTimer();
  await requestWakeLock();

  try {
    const ai = new GoogleGenAI({ apiKey });
    const config = {
      responseModalities: ['AUDIO'],
      inputAudioTranscription: {},
      outputAudioTranscription: {},
      translationConfig: { targetLanguageCode: targetLang, echoTargetLanguage: false }
    };
    if (sysPromptTx) config.systemInstruction = { parts: [{ text: sysPromptTx }] };

    liveSession = await ai.live.connect({
      model: 'gemini-3.5-live-translate-preview',
      config,
      callbacks: {
        onopen: async () => {
          setStatus('● 翻譯中', 'active');
          try { await startMic(); }
          catch (err) {
            showError('麥克風錯誤：' + err.message);
            setStatus('麥克風失敗', 'error');
            window.stopTranslation();
          }
        },

        onmessage: (message) => {
          const u = message.usageMetadata;
          if (u) {
            if (u.promptTokenCount != null)     totalInputTok  = u.promptTokenCount;
            if (u.candidatesTokenCount != null) totalOutputTok = u.candidatesTokenCount;
            if (u.totalTokenCount != null && u.promptTokenCount == null) {
              totalInputTok  = Math.round(u.totalTokenCount * 0.85);
              totalOutputTok = Math.round(u.totalTokenCount * 0.15);
            }
            refreshCost();
          }

          const content = message.serverContent;
          if (!content) return;

          const aiSegNow = document.getElementById('aiSegment').checked;
          if (aiSegNow) {
            let contentChanged = false;
            const inputText  = content.inputTranscription?.text;
            const outputText = content.outputTranscription?.text;
            if (inputText  && inputText  !== origBuffer)  { origBuffer  = inputText;  lastInputAt  = Date.now(); contentChanged = true; }
            if (outputText && outputText !== transBuffer) { transBuffer = outputText; lastOutputAt = Date.now(); contentChanged = true; }

            if (contentChanged) {
              if (origBuffer)  { const el = document.getElementById('originalText');  el.textContent = origBuffer;  el.classList.add('partial'); }
              if (transBuffer) { const el = document.getElementById('translatedText'); el.textContent = transBuffer; el.classList.add('partial'); }
              const done = isPunctEnd(transBuffer) || isPunctEnd(origBuffer);
              scheduleSegmentFlush(done);
            }
            if (content.turnComplete) { clearTimeout(segFlushTimer); segFlushTimer = null; flushSegment(); }
          } else {
            if (content.inputTranscription?.text)  { lastInputAt  = Date.now(); updateImmediateCaption('original',   content.inputTranscription.text); }
            if (content.outputTranscription?.text) { lastOutputAt = Date.now(); updateImmediateCaption('translated', content.outputTranscription.text); }
          }
        },

        onerror: (e) => {
          showError('連線錯誤：' + (e?.message || JSON.stringify(e)));
          setStatus('連線錯誤', 'error');
          window.stopTranslation();
        },
        onclose: (e) => {
          if (running) {
            const reason = e?.reason || '';
            showError('連線中斷' + (reason ? `：${reason}` : '（原因不明）'));
            setStatus('連線中斷', 'error');
            window.stopTranslation();
          }
        }
      }
    });

  } catch (err) {
    showError('連線失敗：' + err.message);
    setStatus('連線失敗', 'error');
    window.stopTranslation();
  }
};

// ── Mic ───────────────────────────────────────────────────────────────────
function nextPow2(n) { return Math.pow(2, Math.round(Math.log2(n))); }

async function startMic() {
  const useNoiseSuppression = document.getElementById('noiseSuppression').value === 'true';
  micStream    = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: useNoiseSuppression }
  });
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') await audioContext.resume();

  const nativeRate = audioContext.sampleRate;
  const source     = audioContext.createMediaStreamSource(micStream);
  const bufferSize = nextPow2(Math.round(nativeRate * 0.1));
  processor        = audioContext.createScriptProcessor(bufferSize, 1, 1);

  processor.onaudioprocess = (e) => {
    if (!liveSession || !running) return;
    const f32 = e.inputBuffer.getChannelData(0);
    audioChunkCount++;

    let samples = f32;
    if (nativeRate !== 16000) {
      const ratio  = nativeRate / 16000;
      const newLen = Math.round(f32.length / ratio);
      samples = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++)
        samples[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
    }

    const i16 = new Int16Array(samples.length);
    let peak = 0;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      peak = Math.max(peak, Math.abs(s));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    lastAudioLevel = peak;
    if (peak < 0.003) silentChunkCount++;

    const bytes = new Uint8Array(i16.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    try { liveSession.sendRealtimeInput({ audio: { data: btoa(bin), mimeType: 'audio/pcm;rate=16000' } }); }
    catch (_) {}
  };

  source.connect(processor);
  processor.connect(audioContext.destination);
}

// ── Stop ──────────────────────────────────────────────────────────────────
window.stopTranslation = function() {
  running = false;
  stopTimer();
  clearTimeout(segFlushTimer); segFlushTimer = null;
  clearAllHistory();
  releaseWakeLock();
  document.getElementById('statusLights').style.display = 'none';
  if (processor)   { try { processor.disconnect(); }   catch(_){} processor   = null; }
  if (audioContext){ try { audioContext.close(); }      catch(_){} audioContext = null; }
  if (micStream)   { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (liveSession) { try { liveSession.close(); }       catch(_){} liveSession = null; }

  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display  = 'none';
  if (!document.getElementById('status').className.includes('error')) setStatus('已停止');
};
